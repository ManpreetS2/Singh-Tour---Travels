<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" role="img" aria-label="Map area: Tagore Garden Extension, West Delhi">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#2A3348" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="900" height="560" fill="#12182A"/>
  <rect width="900" height="560" fill="url(#grid)"/>
  <!-- stylised roads -->
  <path d="M0 280 H900" stroke="#3A455C" stroke-width="10"/>
  <path d="M420 0 V560" stroke="#3A455C" stroke-width="8"/>
  <path d="M0 160 H900" stroke="#2E384C" stroke-width="4"/>
  <path d="M0 400 H900" stroke="#2E384C" stroke-width="4"/>
  <path d="M220 0 V560" stroke="#2E384C" stroke-width="4"/>
  <path d="M680 0 V560" stroke="#2E384C" stroke-width="4"/>
  <!-- park block -->
  <rect x="480" y="200" width="140" height="100" fill="#1A2E28" opacity="0.9"/>
  <text x="550" y="255" text-anchor="middle" fill="#6B8F7E" font-family="IBM Plex Mono, monospace" font-size="12">Woodland Park</text>
  <!-- pin -->
  <circle cx="450" cy="290" r="18" fill="#F2A93B"/>
  <circle cx="450" cy="290" r="7" fill="#0E1424"/>
  <text x="450" y="340" text-anchor="middle" fill="#F4EFE6" font-family="IBM Plex Mono, monospace" font-size="14">J4W4+P4 · Tagore Garden Ext.</text>
  <text x="24" y="536" fill="#9AA3B5" font-family="IBM Plex Mono, monospace" font-size="11">Map illustration · OpenStreetMap contributors · Directions via Google Maps</text>
</svg>
